name: Weekly portfolio audit

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level high
      - id: audit
        run: pnpm audit:weekly
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-audit-report
          path: artifacts/weekly-audit.md
      - name: Open material-finding issue
        if: steps.audit.outputs.material_findings != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Weekly audit found material runtime issues" --body-file artifacts/weekly-audit.md --label audit
